---
role_name_check: 1
dependency:
  name: galaxy

driver:
  name: vagrant
  provision: true
  provider:
    name: libvirt
    #type: libvirt
    options:
      memory: 256
      cpus: 2

platforms:
  # #https://app.vagrantup.com/boxes/search?utf8=%E2%9C%93&sort=downloads&provider=libvirt
  # # default user : vagrant
  # # password : vagrant

  # === Install Python3.8 on RHEL7
  # sudo subscription-manager register
  # sudo yum update
  # sudo yum-config-manager --enable rhel-server-rhscl-7-rpms
  # sudo yum install -y rh-python38
  # sudo ln -sf /opt/rh/rh-python38/root/usr/bin/python3 /usr/bin/python3



  # === generic/centos7
  # sudo sed -i \
  # -e 's|^mirrorlist=|#mirrorlist=|' \
  # -e 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|' \
  # /etc/yum.repos.d/CentOS-Base.repo
  # sudo yum clean all
  #  sudo yum makecache
  # sudo yum repolist
  # sudo yum install -y gcc openssl-devel bzip2-devel libffi-devel wget make
  # cd /usr/src
  #    sudo wget https://www.python.org/ftp/python/3.8.18/Python-3.8.18.tgz
  #    sudo tar xzf Python-3.8.18.tgz
  #    cd Python-3.8.18
  #       sudo ./configure --enable-optimizations
  #       sudo make altinstall
  #       sudo ln -sf /usr/local/bin/python3.8 /usr/bin/python3
  #       sudo ln -sf /usr/local/bin/pip3.8 /usr/bin/pip3

  - name: instance-vagrant-centos7
    box: generic/centos7
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 192.168.10.9
    # instance_raw_config_args:
    #   - 'vm.provision :file, source: "~/Git/Thomas/github.com/AnsibleWorkPlan/roles/os_common/molecule/default/bootstrap.sh", destination: "/tmp/bootstrap.sh"'
    #   - 'vm.provision :shell, inline: "chmod +x /tmp/bootstrap.sh && /tmp/bootstrap.sh"'
    #   - 'vm.provision :file, source: "~/Git/Thomas/github.com/AnsibleWorkPlan/roles/os_common/molecule/default/bootstrap_cento-7.sh", destination: "/tmp/bootstrap_cento-7.sh"'
    #   - 'vm.provision :shell, inline: "chmod +x /tmp/bootstrap_cento-7.sh && /tmp/bootstrap_cento-7.sh"'
    provider_raw_config_args:
      - "storage :file, :type => 'qcow2', :device => 'vdb', :size => '1G'"
      - "storage :file, :type => 'qcow2', :device => 'vdc', :size => '1G'"
      - "storage :file, :type => 'qcow2', :device => 'vdd', :size => '1G'"
      - "storage :file, :type => 'qcow2', :device => 'vde', :size => '1G'"
    groups:
      - molecule_vm

