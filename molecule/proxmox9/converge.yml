---
- name: Converge
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: os_common
  vars:
    os_common_debug_level: 0
    os_common:

      hostname:
        name: 'proxmoxtest01'
        use: debian

      hosts:
        file: '/etc/hosts'
        regexp: '^192.168.10.105 *'
        lines:
          - "192.168.10.105 proxmoxtest01"

      repositories:
        - format: list
          filename: "proxmox-pve"
          repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pve trixie pve-no-subscription"
          certs:
            - url: 'https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg'
              dest: '/usr/share/keyrings/proxmox-archive-keyring.gpg'
          state: present
        - format: sources
          types: deb
          uris: https://enterprise.proxmox.com/debian/pve
          suites: trixie
          components: pve-enterprise
          signed_by: '/usr/share/keyrings/proxmox-archive-keyring.gpg'
          enabled: false
          filename: 'pve-enterprise'
          certs:
            - url: 'https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg'
              dest: '/usr/share/keyrings/proxmox-archive-keyring.gpg'

      packages:
        # Install prerequists and tools
        - name:
            - wget
            - ca-certificates
            - gnupg
            - htop
            - lvm2
            - xfsprogs
            - e2fsprogs
          update_cache: yes
          autoclean: true
          state: present
        # Install the Proxmox VE Kernel
        - name:
            - 'proxmox-default-kernel'
          debconf:
            - name: grub-pc
              question: grub-pc/configure_policy
              value: keep
              vtype: select
            - name: grub-pc
              question: grub-pc/install_devices
              value: ""
              vtype: multiselect
            - name: grub-pc
              question: grub-pc/continue_without_grub
              value: true
              vtype: boolean
            - name: grub-pc
              question: grub-pc/install_devices_empty
              value: true
              vtype: boolean
          state: present
        # Install the Proxmox VE Packages
        - name:
            - proxmox-ve
            - postfix
            - open-iscsi
            - chrony
          state: present
          #reboot: true
        # Remove the Debian Kernel
        - name:
          - linux-image-amd64
          - 'linux-image-6.*'
          state: absent

      groups_manage: true
      groups:
        - name: group_one
          gid: '1042'
        - name: group_two
        - name: 'group_three'
          system: true
        - name: group_four
          state: absent
          force: true
        - name: group_five
          manage: true
        - name: group_six
          manage: false
      users_manage: true
      users:
        - name: 'tchalmel'
          authorized_keys_manage: true
          authorized_keys:
            - authorized_key: 'https://raw.githubusercontent.com/shmii/public_key/main/id_ecdsa.pub'
              manage_dir: true
              state: present
            - authorized_key: 'https://raw.githubusercontent.com/shmii/public_key/main/id_rsa.pub'
              manage_dir: true
              state: present
        - name: 'user_one'
        - name: 'user_two'
          state: present
          group: 'group_two'
        - name: 'user_three'
          append: true
          groups: 'group_one, group_two'
        - name: 'user_four'
          append: true
          groups:
            - group_one
            - group_two
        - name: 'user_five'
          state: absent
          remove: true
      directories_manage: true
      directories:
        - path: '/mnt'
        - path: '/mnt/mount_point_one'
          owner: 'user_one'
        - path: '/mnt/mount_point_two'
          owner: 'user_two'
          group: 'group_two'
        - path: '/mnt/mount_point_three'
          owner: 'user_three'
          group: 'group_three'
          mode: '755'
        - path: '/mnt/mount_point_four'
          owner: 'root'
          group: 'root'
          mode: '755'
        - path: '/mnt/mount_point_five'
          owner: 'root'
          group: 'root'
          mode: '755'
        - path: '/mnt/mount_point_six'
          owner: 'root'
          group: 'root'
          mode: '755'
        - path: /app
          owner: "root"
          group: "root"
          mode: '755'
        - path: /app/infra
          owner: "root"
          group: "root"
          mode: '755'
        - path: /app/test
          owner: "root"
          group: "root"
          mode: '755'
      lvm_manage: true
      pvs_manage: true
      lvs_manage: true
      vgs_manage: true
      vgs:
        - name: "vg_one"
          tag: 'VGONE'
          manage: true
          lvs_manage: true
          lvs:
            - name: "lv_one"
              size: '500m'
              manage: true
              fs:
                fstype: 'ext2'
                resizefs: true
                manage: true
              mount_point:
                path: /mnt/mount_point_one
                mode: '755'
                manage: true
            - name: "lv_two"
              size: '500m'
              fs:
                fstype: 'ext3'
                resizefs: true
              mount_point:
                path: /mnt/mount_point_two
                mode: '755'
            - name: "lv_three"
              size: '500m'
              fs:
                fstype: 'ext4'
                resizefs: true
              mount_point:
                path: /mnt/mount_point_three
                mode: '755'
        - name: "vg_two"
          tag: 'VGTWO'
          manage: true
          lvs_manage: true
          lvs:
            - name: "lv_four"
              size: '500m'
              fs:
                fstype: 'xfs'
              mount_point:
                path: /mnt/mount_point_four
                mode: '755'
                manage: true
            - name: "lv_five"
              size: '500m'
              fs:
                fstype: 'xfs'
              mount_point:
                path: /mnt/mount_point_five
                mode: '755'
            - name: "lv_six"
              size: '500m'
              fs:
                fstype: 'xfs'
              mount_point:
                path: /mnt/mount_point_six
                mode: '755'
      disks:
        - path: '/dev/vdb'
          tag: 'VGONE'
        - path: '/dev/vdc'
          tag: 'VGONE'
        - path: '/dev/vdd'
          tag: 'VGTWO'
        - path: '/dev/vde'
          tag: 'VGTWO'

...
