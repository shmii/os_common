---
- name: "OS Common - Users - Debug Informations"
  ansible.builtin.debug:
    msg:
      - os_common.users: "{{ os_common.users | default('') }}"
      - os_common.users_manage: "{{ os_common.users_manage | default('') }}"
    verbosity: "{{ os_common_debug_level | default(2) }}"
  tags:
    - os_common
    - os_common_debug
    - os_common_users
    - os_common_users_debug

- name: "OS Common - Users - Check"
  ansible.builtin.include_tasks: user.yml
  loop: "{{ os_common.users | default([], true) }}"
  loop_control:
    loop_var: user
  when:
    - os_common.get('users', []) | length > 0
    - os_common.get('users_manage', true)
  tags:
    - os_common
    - os_common_users
    - os_common_users_check

...
