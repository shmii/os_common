---
- name: "OS Common - Redhat Family - Repositories - Manage repositories - Debug Informations"
  ansible.builtin.debug:
    msg:
      - "ansible_pkg_mgr: {{ ansible_pkg_mgr | default('') }}"
      - "__os_common_package_manager_backend: {{ __os_common_package_manager_backend | default('') }}"
      - "__os_common_repositories_manage: {{ __os_common_repositories_manage | default(false) }}"
      - "__os_common_repositories: {{ __os_common_repositories | default([]) }}"
    verbosity: "{{ os_common_debug_level | default(1) }}"
  tags:
    - os_common
    - os_common_repositories
    - os_common_repositories_debug
    - os_common_rhel
    - os_common_rhel_repositories
    - os_common_rhel_repositories_debug
    - os_common_rhel_repositories_repositories
    - os_common_rhel_repositories_repositories_debug

- name: "OS Common - Redhat Family - Repositories - Manage repositories - Debug Informations"
  ansible.builtin.include_tasks: rhel_repositories_repository.yml
  loop: "{{ __os_common_repositories | default([], true) }}"
  loop_control:
    loop_var: repository
  when:
    - __os_common_repositories_manage | default(false)
  tags:
    - os_common
    - os_common_repositories
    - os_common_repositories_debug
    - os_common_rhel
    - os_common_rhel_repositories
    - os_common_rhel_repositories_debug
    - os_common_rhel_repositories_repositories
    - os_common_rhel_repositories_repositories_check
...
