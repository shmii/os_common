---
- name: "OS Common - Redhat Family - SELinux - Packages - Package - Debug Informations : {{ selinux_package.name | default('') }}"
  ansible.builtin.debug:
    msg:
      - "selinux_package: {{ selinux_package | default('') }}"
    verbosity: "{{ os_common_debug_level | default(3) }}"
  tags:
    - os_common
    - os_common_selinux
    - os_common_selinux_packages
    - os_common_selinux_packages_package
    - os_common_selinux_packages_package_debug
    - os_common_rhel_selinux_packages
    - os_common_rhel_selinux_packages_package
    - os_common_rhel_selinux_packages_package_debug

- name: "OS Common - Redhat Family - SELinux - Packages - Package - Ensure required packages - Yum: {{ selinux_package.name | default('') }}"
  ansible.builtin.yum:
    allow_downgrade: "{{ selinux_package.allow_downgrade | default(omit) }}"
    autoremove: "{{ selinux_package.autoremove | default(omit) }}"
    bugfix: "{{ selinux_package.bugfix | default(omit) }}"
    cacheonly: "{{ selinux_package.cacheonly | default(omit) }}"
    conf_file: "{{ selinux_package.conf_file | default(omit) }}"
    disable_excludes: "{{ selinux_package.disable_excludes | default(omit) }}"
    disable_gpg_check: "{{ selinux_package.disable_gpg_check | default(omit) }}"
    disable_plugin: "{{ selinux_package.disable_plugin | default(omit) }}"
    disablerepo: "{{ selinux_package.disablerepo | default(omit) }}"
    download_dir: "{{ selinux_package.download_dir | default(omit) }}"
    download_only: "{{ selinux_package.download_only | default(omit) }}"
    enable_plugin: "{{ selinux_package.enable_plugin | default(omit) }}"
    enablerepo: "{{ selinux_package.enablerepo | default(omit) }}"
    exclude: "{{ selinux_package.exclude | default(omit) }}"
    install_repoquery: "{{ selinux_package.install_repoquery | default(omit) }}"
    install_weak_deps: "{{ selinux_package.install_weak_deps | default(omit) }}"
    installroot: "{{ selinux_package.installroot | default(omit) }}"
    list: "{{ selinux_package.list | default(omit) }}"
    lock_timeout: "{{ selinux_package.lock_timeout | default(omit) }}"
    name: "{{ selinux_package.name }}"
    releasever: "{{ selinux_package.releasever | default(omit) }}"
    security: "{{ selinux_package.security | default(omit) }}"
    skip_broken: "{{ selinux_package.skip_broken | default(omit) }}"
    sslverify: "{{ selinux_package.sslverify | default(omit) }}"
    state: "{{ selinux_package.state | default(omit) }}"
    update_cache: "{{ selinux_package.update_cache | default(omit) }}"
    update_only: "{{ selinux_package.update_only | default(omit) }}"
    #use_backend: "{{ __os_common_package_manager_backend | default('auto') }}"
    use_backend: "{{ selinux_package.use_backend | default(omit) }}"
    validate_certs: "{{ selinux_package.validate_certs | default(omit) }}"
  register: yum_res
  retries: "{{ __os_common_repositories_retry | default('5') }}"
  delay: "{{ __os_common_repositories_delay | default('10') }}"
  until: yum_res is success
  when:
    - (__os_common_package_manager | default(ansible_pkg_mgr)) == 'yum'
    - selinux_package.manage | default(true)
    - selinux_package | default([]) | length > 0
    - selinux_package.name | default('') | length > 0 
  tags:
    - os_common
    - os_common_selinux
    - os_common_selinux_packages
    - os_common_selinux_packages_package
    - os_common_selinux_packages_package_ensure
    - os_common_selinux_packages_package_ensure_yum
    - os_common_rhel_selinux_packages
    - os_common_rhel_selinux_packages_package
    - os_common_rhel_selinux_packages_package_debug
    - os_common_rhel_selinux_packages_package_ensure
    - os_common_rhel_selinux_packages_package_ensure_yum

- name: "OS Common - Redhat Family - SELinux - Packages - Package - Ensure Required Packages - Dnf: {{ selinux_package.name | default('') }}"
  ansible.builtin.dnf:
    allow_downgrade: "{{ selinux_package.allow_downgrade | default(omit) }}"
    allowerasing: "{{ selinux_package.allowerasing | default(omit) }}"
    autoremove: "{{ selinux_package.autoremove | default(omit) }}"
    best: "{{ selinux_package.best | default(omit) }}"
    bugfix: "{{ selinux_package.bugfix | default(omit) }}"
    cacheonly: "{{ selinux_package.cacheonly | default(omit) }}"
    conf_file: "{{ selinux_package.conf_file | default(omit) }}"
    disable_excludes: "{{ selinux_package.disable_excludes | default(omit) }}"
    disable_gpg_check: "{{ selinux_package.disable_gpg_check | default(omit) }}"
    disable_plugin: "{{ selinux_package.disable_plugin | default(omit) }}"
    disablerepo: "{{ selinux_package.disablerepo | default(omit) }}"
    download_dir: "{{ selinux_package.download_dir | default(omit) }}"
    download_only: "{{ selinux_package.download_only | default(omit) }}"
    enable_plugin: "{{ selinux_package.enable_plugin | default(omit) }}"
    enablerepo: "{{ selinux_package.enablerepo | default(omit) }}"
    exclude: "{{ selinux_package.exclude | default(omit) }}"
    install_weak_deps: "{{ selinux_package.install_weak_deps | default(omit) }}"
    installroot: "{{ selinux_package.installroot | default(omit) }}"
    list: "{{ selinux_package.list | default(omit) }}"
    lock_timeout: "{{ selinux_package.lock_timeout | default(omit) }}"
    name: "{{ selinux_package.name }}"
    nobest: "{{ selinux_package.nobest | default(omit) }}"
    releasever: "{{ selinux_package.releasever | default(omit) }}"
    security: "{{ selinux_package.security | default(omit) }}"
    skip_broken: "{{ selinux_package.skip_broken | default(omit) }}"
    sslverify: "{{ selinux_package.sslverify | default(omit) }}"
    state: "{{ selinux_package.state | default(omit) }}"
    update_cache: "{{ selinux_package.update_cache | default(omit) }}"
    update_only: "{{ selinux_package.update_only | default(omit) }}"
    use_backend: "{{ selinux_package.use_backend | default(omit) }}"
    validate_certs: "{{ selinux_package.validate_certs | default(omit) }}"
  register: dnf_res
  retries: "{{ __os_common_packages_retry | default('5') }}"
  delay: "{{ __os_common_packages_delay | default('10') }}"
  until: dnf_res is success
  when:
    - (__os_common_package_manager | default(ansible_pkg_mgr)) == 'dnf' or (__os_common_package_manager | default(ansible_pkg_mgr)) == 'dnf5'
    - selinux_package.manage | default(true)
    - selinux_package | default([]) | length > 0 
  tags:
    - os_common
    - os_common_selinux
    - os_common_selinux_packages
    - os_common_selinux_packages_package
    - os_common_selinux_packages_package_ensure
    - os_common_selinux_packages_package_ensure_dnf
    - os_common_rhel_selinux_packages
    - os_common_rhel_selinux_packages_package
    - os_common_rhel_selinux_packages_package_debug
    - os_common_rhel_selinux_packages_package_ensure
    - os_common_rhel_selinux_packages_package_ensure_dnf

