- name: "OS Common - Redhat Family - SELinux - Packages - Package - Reboot - Debug : {{ selinux_package.name | default('') }}"
  ansible.builtin.debug:
    msg:
      - "yum_res: {{ yum_res | default([]) }}"
      - "dnf_res: {{ dnf_res | default([]) }}"
      - "reboot_required_rh: {{ reboot_required_rh | default('') }}"
      - "reboot_required: {{ reboot_required | default('') }}"
      - "selinux_package: {{ selinux_package | default([]) }}"
    verbosity: "{{ os_common_debug_level | default(0) }}"
  tags:
    - os_common
    - os_common_selinux
    - os_common_selinux_packages
    - os_common_selinux_packages_package
    - os_common_selinux_packages_package_reboot
    - os_common_selinux_packages_package_reboot_debug
    - os_common_rhel_selinux_packages
    - os_common_rhel_selinux_packages_package
    - os_common_rhel_selinux_packages_package_reboot
    - os_common_rhel_selinux_packages_package_reboot_debug

- name: "OS Common - Redhat Family - SELinux - Packages - Ensure reboot if needed : {{ selinux_package.name | default('') }}"
  ansible.builtin.reboot:
    reboot_timeout: 600   # Wait up to 10 minutes
    test_command: whoami  # Command used to verify that the server is ready
  when:
    - selinux_package.manage | default(true)
    - ((selinux_package.reboot | default(false)) or (reboot_required | default(false)))
    - selinux_package | default([]) | length > 0
  tags:
    - os_common
    - os_common_selinux
    - os_common_selinux_packages
    - os_common_selinux_packages_package
    - os_common_selinux_packages_package_reboot
    - os_common_selinux_packages_package_reboot_ensure
    - os_common_rhel_selinux_packages
    - os_common_rhel_selinux_packages_package
    - os_common_rhel_selinux_packages_package_reboot
    - os_common_rhel_selinux_packages_package_reboot_ensure
    
...
