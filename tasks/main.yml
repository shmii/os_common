---
# Loading OS correct vars
- name: "OS Common - Vars - Load"
  ansible.builtin.import_tasks: load_vars.yml
  tags:
    - os_common
    - os_common_vars
    - os_common_vars_load

- name: "OS Common - Vars - Print Informations"
  ansible.builtin.debug:
    msg:
      - "+----------------------------------------------------------------------------------+"
      - "ansible_os_family: {{ ansible_os_family | default('') }}"
      - "ansible_distribution: {{ ansible_distribution | default('') }}"
      - "ansible_distribution_release: {{ ansible_distribution_release | default('') }}"
      - "ansible_distribution_major_version: {{ ansible_distribution_major_version | default('') }}"
      - "ansible_distribution_version: {{ ansible_distribution_version | default('') }}"
      - "ansible_verbosity: {{ ansible_verbosity | default('') }}"
      - "+----------------------------------------------------------------------------------+"
      - "os_common_debug_level : {{ os_common_debug_level | default('') }}"
      - "os_common : {{ os_common | default([]) }}"
      - "+----------------------------------------------------------------------------------+"
    verbosity: "{{ os_common_debug_level | default(1) }}"
  tags:
    - os_common
    - os_common_vars
    - os_common_vars_debug

# Run Tasks.
- name: "OS Common - Hostname"
  ansible.builtin.import_tasks: hostname.yml
  tags:
    - os_common
    - os_common_hostname

# Run Tasks.
- name: "OS Common - Hosts File"
  ansible.builtin.import_tasks: hosts.yml
  tags:
    - os_common
    - os_common_hosts

- name: OS Common - Redhat Family
  when: ansible_os_family in ['RedHat', 'Rocky']
  tags:
    - os_common
    - os_common_rhel
  block:
    - name: OS Common - Redhat Family - Include RHEL tasks
      ansible.builtin.include_tasks: rhel_main.yml

- name: "OS Common - Debian Familly"
  when: ansible_os_family in ['Debian']
  tags:
    - os_common
    - os_common_debian
  block:
    - name: OS Common - Debian Family - Include Debian tasks
      ansible.builtin.include_tasks: debian_main.yml

...
