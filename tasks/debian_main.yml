---
- name: "OS Common - Debian Family - Repositories"
  ansible.builtin.import_tasks: debian_repositories.yml
  when: >
    (
      (__os_common_repositories | default([]) | length > 0 and __os_common_repositories_manage | default(true))
      or
      (os_common.get('repositories', []) | length > 0 and os_common.get('repositories_manage', true))
    )
  tags:
    - os_common
    - os_common_repositories
    - os_common_debian
    - os_common_debian_repositories

- name: "OS Common - Debian Family - Packages"
  ansible.builtin.import_tasks: debian_packages.yml
  when: >
    (
      (__os_common_packages | default([]) | length > 0 and __os_common_packages_manage | default(true))
      or
      (os_common.get('packages', []) | length > 0 and os_common.get('packages_manage', true))
    )
  tags:
    - os_common
    - os_common_packages
    - os_common_debian
    - os_common_debian_packages


