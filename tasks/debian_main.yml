- name: "OS Common - Debian Family - LVM"
  ansible.builtin.import_tasks: lvm.yml
  when:
    - os_common.get('lvm_manage', true)
  tags:
    - os_common
    - os_common_lvms
    - os_common_debian
    - os_common_debian_lvms

