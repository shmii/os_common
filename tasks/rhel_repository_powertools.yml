---
- name: "OS Common - Redhat Family - Repositories - PowerTools Repository - Debug Informations"
  ansible.builtin.debug:
    msg:
      - "ansible_pkg_mgr: {{ ansible_pkg_mgr | default('') }}"
      - "__os_common_powertools_repository_file: {{ __os_common_powertools_repository_file | default('') }}"
      - "__os_common_powertools_repository_name: {{ __os_common_powertools_repository_name | default('') }}"
    verbosity: "{{ os_common_debug_level | default(2) }}"
  tags:
    - os_common
    - os_common_repositories
    - os_common_repositories_debug
    - os_common_rhel
    - os_common_rhel_repositories
    - os_common_rhel_repositories_debug
    - os_common_rhel_repository_powertools
    - os_common_rhel_repository_powertools_debug

- name: "OS Common - Redhat Family - Repositories - PowerTools Repository - Enable powertools (dnf plugins core)"
  ansible.builtin.dnf:
    name: "dnf-plugins-core"
    use_backend: "{{ __os_common_package_manager_backend | default('auto') }}"
    state: present
    enablerepo: "epel"
  register: result
  until: result is succeeded
  retries: "{{ __os_common_repositories_retry | default('5') }}"
  delay: "{{ __os_common_repositories_delay | default('10') }}"
  when: 
    - (epel_file_check.stat.exists | default(false)) or (not epel_uri_check.failed | default(true))
    - (ansible_distribution_major_version | int >= 8) or (ansible_distribution == "Amazon" and ansible_distribution_version is match("^2023"))
  notify:
    - "Update repository cache"
  tags:
    - os_common
    - os_common_repositories
    - os_common_repositories_debug
    - os_common_rhel
    - os_common_rhel_repositories
    - os_common_rhel_repositories_debug
    - os_common_rhel_repository_powertools
    - os_common_rhel_repository_powertools_dnf_enable

- name: "OS Common - Redhat Family - Repositories - PowerTools Repository - Enable powertools"
  community.general.ini_file:
    path: "/etc/yum.repos.d/{{ __os_common_powertools_repository_file }}"
    section: "{{ __os_common_powertools_repository_name }}"
    option: enabled
    value: "1"
    mode: "0644"
  notify:
    - "Update repository cache"
  tags:
    - os_common
    - os_common_repositories
    - os_common_repositories_debug
    - os_common_rhel
    - os_common_rhel_repositories
    - os_common_rhel_repositories_debug
    - os_common_rhel_repository_powertools
    - os_common_rhel_repository_powertools_enable
...
