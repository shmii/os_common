---
__os_common_repositories_manage: true
__os_common_repositories:
  #####################################
  #remove old debian buster repos
  #####################################
  - repo: "deb http://deb.debian.org/debian/ buster main"
    state: absent
  - repo: "deb-src http://deb.debian.org/debian/ buster main"
    state: absent
  - repo: "deb http://security.debian.org/debian-security buster/updates main"
    state: absent
  - repo: "deb-src http://security.debian.org/debian-security buster/updates main"
    state: absent
  #####################################
  # Add "debian-archive" repositories
  #####################################
  # archive.debian.org/debian
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian/ buster contrib main non-free"
    validate_certs: false
    state: present
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian/ buster-updates contrib main non-free"
    validate_certs: false
    state: present
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian/ buster-proposed-updates contrib main non-free"
    validate_certs: false
    state: present
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian/ buster-backports contrib main non-free"
    validate_certs: false
    state: present
  # archive.debian.org/debian-security
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian-security/ buster/updates contrib main non-free non-free-firmware"
    validate_certs: false
    state: present

__os_common_packages:
  - name :
    - bash-completion
    - htop
    - vim
    - curl
    - tmux
    - screen
    - python3
    - python3-apt
    - python3-pexpect
    - python3-pip
    - telnet
    - cifs-utils
    - tree
    - lvm2
    - xfsprogs
    state: present
    force_apt_get: true
    update_cache: true
    allow_unauthenticated: true
...
