---
__os_common_repositories_manage: true
__os_common_repositories:
  #####################################
  #remove old debian buster repos
  #####################################
  # ftp.debian.org/debian
  - repo: "deb http://ftp.debian.org/debian/ stretch main"
    state: absent
  - repo: "deb-src http://ftp.debian.org/debian/ stretch main"
    state: absent
  - repo: "deb http://ftp.debian.org/debian/ stretch-updates main"
    state: absent
  - repo: "deb-src http://ftp.debian.org/debian/ stretch-updates main"
    state: absent
  # ftp.us.debian.org/debian
  - repo: "deb http://ftp.us.debian.org/debian/ stretch main"
    state: absent
  - repo: "deb-src http://ftp.us.debian.org/debian/ stretch main"
    state: absent
  # security.debian.org/debian-security
  - repo: "deb http://security.debian.org/debian-security stretch/updates main"
    state: absent
  - repo: "deb-src http://security.debian.org/debian-security stretch/updates main"
    state: absent
  #####################################
  # Add "debian-archive" repositories
  #####################################
  # archive.debian.org/debian
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian/ stretch main contrib non-free"
    validate_certs: false
    state: present
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian/ stretch-backports main contrib non-free"
    validate_certs: false
    state: present
  # archive.debian.org/debian-security
  - filename: "debian-archive"
    repo: "deb http://archive.debian.org/debian-security/ stretch/updates contrib main non-free"
    validate_certs: false
    state: present

__os_common_packages:
  - name :
    - bash-completion
    - htop
    - vim
    - curl
    - tmux
    - screen
    - python3
    - python3-apt
    - python3-pexpect
    - python3-pip
    - telnet
    - cifs-utils
    - tree
    - lvm2
    - xfsprogs
    state: present
    force_apt_get: true
    update_cache: true
    allow_unauthenticated: true
...
